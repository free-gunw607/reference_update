name: DocPool Update Bot

on:
  schedule:
    # 한국 시간 01:45 (UTC 16:45)
    - cron: '20 17 * * *'
  
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run_docpool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run DocPool Bot
        env:
          # 구글 시트 키
          GDRIVE_CREDS: ${{ secrets.GDRIVE_CREDS }}
          # 👇 [추가됨] 텔레그램 알림을 위해 꼭 필요합니다!
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: python docpool_bot.py
