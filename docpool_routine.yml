name: DocPool Update Bot

on:
  schedule:
    # -----------------------------------------------------------
    # [⏰ UTC 시간 계산법]
    # (한국 시간) - 9시간 = (UTC 시간)
    #
    # [설정] 매일 아침 8시 (08:00 KST) 실행
    # 8 - 9 = -1 (날짜 넘어가서 23시)
    # -----------------------------------------------------------
    - cron: '45 16 * * *'
    
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run_docpool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run DocPool Bot
        env:
          # 구글 시트 키 (Secrets에서 가져옴)
          GDRIVE_CREDS: ${{ secrets.GDRIVE_CREDS }}
        run: python docpool_bot.py
