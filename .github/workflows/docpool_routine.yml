name: DocPool Update Bot

on:
  schedule:
    # 08:00, 13:00, 15:00, 18:00, 20:00 (KST)
    - cron: '0 4,6,9,11,23 * * *'
  workflow_dispatch:

jobs:
  run_docpool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        # google-generativeai 라이브러리가 설치되도록 requirements.txt 확인 필수!
        run: pip install -r requirements.txt
        
      - name: Run Bots
        env:
          GDRIVE_CREDS: ${{ secrets.GDRIVE_CREDS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          # [추가] Gemini API 키 환경변수
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "🤖 1. 소중한추억 봇 실행 중..."
          python docpool_bot.py || echo "⚠️ DocPool 실행 중 오류 발생 (무시하고 계속)"
          
          echo "--------------------------------"
          
          echo "🤖 2. 주식 증권사 리포트 봇 (AI Trial) 실행 중..."
          # [변경] 기존 봇 대신 AI 버전 실행!
          # python company_report_bot.py  <-- 기존 봇 주석 처리
          python company_report_bot_ai.py || echo "⚠️ Company Report(AI) 실행 중 오류 발생 (무시하고 계속)"
          
          echo "--------------------------------"
          
          echo "🤖 3. Papers 봇 실행 중..."
          python papers_bot.py || echo "⚠️ Papers 실행 중 오류 발생"
