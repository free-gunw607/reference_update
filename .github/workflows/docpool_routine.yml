name: Reference Update Bots
on:
  schedule:
    # 07:00, 08:00, 13:00, 15:00, 18:00, 20:00 (KST)
    - cron: '0 4,6,9,11,22,23 * * *'
  workflow_dispatch:
    inputs:
      bots:
        description: 'Comma-separated bots (docpool,papers,company_report,quick_report,smic)'
        required: false
        default: 'all'

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run bots
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          DOCPOOL_SESSION_STRING: ${{ secrets.DOCPOOL_SESSION_STRING }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CLIENT_SECRET_JSON: ${{ secrets.GOOGLE_CLIENT_SECRET_JSON }}
          GOOGLE_REFRESH_TOKEN_JSON: ${{ secrets.GOOGLE_REFRESH_TOKEN_JSON }}
        run: |
          BOTS="${{ github.event.inputs.bots || 'all' }}"
          echo "🤖 Running bots: $BOTS"
          python run_all.py --bots "$BOTS" --search-update --trigger cron
