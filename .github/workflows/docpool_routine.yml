name: DocPool Update Bot
#restart
on:
  schedule:
    # 08:00, 13:00, 15:00, 18:00, 20:00 (KST)
    - cron: '0 4,6,9,11,23 * * *'
  workflow_dispatch:
    inputs:
      run_docpool:
        description: "Run DOC_POOL bot"
        required: true
        default: true
        type: boolean
      run_company_report:
        description: "Run company report bot (AI)"
        required: true
        default: true
        type: boolean
      run_papers:
        description: "Run papers bot"
        required: true
        default: true
        type: boolean
      docpool_from:
        description: "DOC_POOL backfill start date (YYYY-MM-DD, optional)"
        required: false
        type: string
      docpool_to:
        description: "DOC_POOL backfill end date (YYYY-MM-DD, optional)"
        required: false
        type: string

jobs:
  run_docpool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        # google-generativeai 라이브러리가 설치되도록 requirements.txt 확인 필수!
        run: pip install -r requirements.txt
        
      - name: Run Bots
        env:
          GDRIVE_CREDS: ${{ secrets.GDRIVE_CREDS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          # [추가] Gemini API 키 환경변수
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DOCPOOL_BACKFILL_FROM: ${{ github.event.inputs.docpool_from }}
          DOCPOOL_BACKFILL_TO: ${{ github.event.inputs.docpool_to }}
        run: |
          echo "Inputs: run_docpool=${{ github.event.inputs.run_docpool }}, run_company_report=${{ github.event.inputs.run_company_report }}, run_papers=${{ github.event.inputs.run_papers }}"
          echo "DOCPOOL backfill: FROM=${DOCPOOL_BACKFILL_FROM} TO=${DOCPOOL_BACKFILL_TO}"
          RUN_DOCPOOL="${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_docpool == 'true' }}"
          RUN_COMPANY="${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_company_report == 'true' }}"
          RUN_PAPERS="${{ github.event_name != 'workflow_dispatch' || github.event.inputs.run_papers == 'true' }}"

          if [ "$RUN_DOCPOOL" = "true" ]; then
            echo "🤖 1. 소중한추억 봇 실행 중..."
            python docpool_bot.py || echo "⚠️ DocPool 실행 중 오류 발생 (무시하고 계속)"
          else
            echo "⏭️ 1. 소중한추억 봇 스킵"
          fi
          
          echo "--------------------------------"
          
          if [ "$RUN_COMPANY" = "true" ]; then
            echo "🤖 2. 주식 증권사 리포트 봇 (AI Trial) 실행 중..."
            python company_report_bot_ai.py || echo "⚠️ Company Report(AI) 실행 중 오류 발생 (무시하고 계속)"
          else
            echo "⏭️ 2. 주식 증권사 리포트 봇 스킵"
          fi
          
          echo "--------------------------------"
          
          if [ "$RUN_PAPERS" = "true" ]; then
            echo "🤖 3. Papers 봇 실행 중..."
            python papers_bot.py || echo "⚠️ Papers 실행 중 오류 발생"
          else
            echo "⏭️ 3. Papers 봇 스킵"
          fi
