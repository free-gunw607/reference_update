name: DocPool Update Bot

on:
  schedule:
    # -----------------------------------------------------------
    # [⏰ UTC 시간 계산법]
    # (한국 시간) - 9시간 = (UTC 시간)
    #
    # [설정] 매일 새벽 1시 45분 (01:45 KST) 실행
    # 01:45 - 9시간 = 전날 16:45
    # -----------------------------------------------------------
    - cron: '40 17 * * *'
    
  workflow_dispatch: # 수동 실행 버튼

jobs:
  run_docpool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run DocPool Bot
        # 👇 [중요] 여기가 핵심입니다! 이 3줄이 있어야 봇이 열쇠를 받습니다.
        env:
          GDRIVE_CREDS: ${{ secrets.GDRIVE_CREDS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: python docpool_bot.py
