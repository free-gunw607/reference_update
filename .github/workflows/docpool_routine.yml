name: DocPool Update Bot

on:
  schedule:
    # 매일 새벽 1시 45분 (01:45 KST)
    - cron: '45 16 * * *'
  workflow_dispatch:

jobs:
  run_docpool:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install -r requirements.txt
        
      - name: Run DocPool Bot
        env:
          # 👇 이 부분들이 꼭 있어야 합니다!
          GDRIVE_CREDS: ${{ secrets.GDRIVE_CREDS }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
        run: python docpool_bot.py
